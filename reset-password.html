<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Set a new password for your Appreciart IE artist account.">
  <meta name="robots" content="noindex, nofollow">
  <title>Reset Password — Appreciart IE</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="login-wrap">
    <div class="login-box">

      <span class="section-label">Artist Portal</span>
      <h1 class="section-title login-title">Reset password</h1>

      <p class="section-body login-desc">Choose a new password for your account.</p>

      <!-- Reset form (shown when a token is present) -->
      <form id="resetForm" autocomplete="off" novalidate>

        <div class="login-group">
          <label class="login-label" for="password">New password</label>
          <input class="login-input" id="password" name="password" type="password" required autocomplete="new-password" minlength="8" placeholder="••••••••">
        </div>

        <div class="login-group">
          <label class="login-label" for="confirm">Confirm new password</label>
          <input class="login-input" id="confirm" name="confirm" type="password" required autocomplete="new-password" minlength="8" placeholder="••••••••">
        </div>

        <button id="resetBtn" class="btn btn-primary login-submit" type="submit">Reset password</button>

        <p id="resetMsg" class="login-error" role="alert"></p>

      </form>

      <!-- Invalid / expired link state (shown when no token or backend rejects it) -->
      <div id="resetInvalid" class="reset-invalid">
        <p class="section-body login-desc">This reset link is invalid or has expired. Please request a new one.</p>
        <a href="forgot-password.html" class="btn btn-primary login-submit">Request a new link</a>
      </div>

    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
