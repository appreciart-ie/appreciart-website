<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Appreciart IE</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="dash-wrap">

    <nav class="dash-tabs">
      <button class="dash-tab active" data-tab="bookings">Bookings</button>
      <button class="dash-tab" data-tab="availability">Availability</button>
    </nav>

    <!-- BOOKINGS -->
    <section class="dash-panel active" id="tab-bookings">
      <div id="bookingsList" class="bookings-list">
        <p class="dash-empty">Loading…</p>
      </div>
    </section>

    <!-- AVAILABILITY -->
    <section class="dash-panel" id="tab-availability">

      <div class="cal-header">
        <button class="cal-nav" id="calPrev">&#8592;</button>
        <span class="cal-month" id="calMonth">—</span>
        <button class="cal-nav" id="calNext">&#8594;</button>
      </div>

      <div class="cal-grid" id="calGrid"></div>

      <p class="cal-legend">
        <span class="cal-dot available"></span> Available
        <span class="cal-dot unavailable"></span> Unavailable
        <span class="cal-dot booked"></span> Booked
      </p>

    </section>

  </main>

  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
