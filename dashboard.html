<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Appreciart IE</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="dash-wrap">

    <nav class="dash-tabs" id="dashTabs">
      <button class="dash-tab active" data-tab="bookings" data-roles="resident,admin">Bookings</button>
      <button class="dash-tab" data-tab="availability">Availability</button>
      <button class="dash-tab" data-tab="profile">Profile</button>
    </nav>

    <!-- BOOKINGS -->
    <section class="dash-panel active" id="tab-bookings">
      <div id="bookingsList" class="bookings-list">
        <p class="dash-empty">Loading…</p>
      </div>
    </section>

    <!-- PROFILE -->
    <section class="dash-panel" id="tab-profile">
      <div class="profile-form" id="profileForm">

        <div class="profile-field">
          <label class="profile-label" for="profileBio">Bio</label>
          <textarea class="profile-input profile-textarea" id="profileBio" rows="5" placeholder="Your bio..."></textarea>
        </div>

        <div class="profile-field">
          <label class="profile-label" for="profileInstagram">Instagram</label>
          <input class="profile-input" id="profileInstagram" type="text" placeholder="@yourhandle">
        </div>

        <div class="profile-field" id="whatsappField">
          <label class="profile-label" for="profileWhatsapp">WhatsApp link</label>
          <input class="profile-input" id="profileWhatsapp" type="text" placeholder="https://wa.me/your-number">
          <p class="profile-hint">Clients will contact you directly here.</p>
        </div>

        <div class="profile-field" id="bookingUrlField">
          <label class="profile-label" for="profileBookingUrl">Booking link</label>
          <input class="profile-input" id="profileBookingUrl" type="text" placeholder="https://your-booking-site.com">
          <p class="profile-hint">Your own booking page — Calendly, your website, etc.</p>
        </div>

        <div class="profile-field">
          <label class="profile-label">Styles</label>
          <div class="profile-styles" id="profileStyles"></div>
          <div class="profile-style-add">
            <input class="profile-input" id="profileStyleInput" type="text" placeholder="Add style..." maxlength="50">
            <button class="btn btn-secondary btn-sm" id="profileStyleBtn">Add</button>
          </div>
        </div>

        <div class="profile-actions">
          <button class="btn btn-primary" id="profileSaveBtn">Save changes</button>
        </div>

        <div class="profile-divider"></div>

        <div class="profile-photos">

          <div class="profile-field">
            <label class="profile-label">Profile photo</label>
            <div class="profile-photo-preview" id="profilePhotoPreview"></div>
            <input type="file" id="profilePhotoInput" accept="image/jpeg,image/png,image/webp" class="profile-photo-file">
            <button class="btn btn-secondary btn-sm" id="profilePhotoBtn">Upload profile photo</button>
          </div>

          <div class="profile-field">
            <label class="profile-label">Portfolio <span class="profile-photo-count" id="portfolioCount"></span></label>
            <div class="profile-portfolio-grid" id="portfolioGrid"></div>
            <input type="file" id="portfolioPhotoInput" accept="image/jpeg,image/png,image/webp" class="profile-photo-file">
            <button class="btn btn-secondary btn-sm" id="portfolioPhotoBtn">Add portfolio image</button>
          </div>

        </div>

      </div>
    </section>

    <!-- AVAILABILITY -->
    <section class="dash-panel" id="tab-availability">

      <div class="cal-header">
        <button class="cal-nav" id="calPrev">&#8592;</button>
        <span class="cal-month" id="calMonth">—</span>
        <button class="cal-nav" id="calNext">&#8594;</button>
      </div>

      <div class="cal-grid" id="calGrid"></div>

      <p class="cal-legend" id="calLegend"></p>

    </section>

  </main>

  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
