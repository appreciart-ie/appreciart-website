<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Appreciart IE artist password.">
  <meta name="robots" content="noindex, nofollow">
  <title>Forgot Password — Appreciart IE</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div id="site-header"></div>

  <main class="login-wrap">
    <div class="login-box">

      <span class="section-label">Artist Portal</span>
      <h1 class="section-title login-title">Forgot password</h1>

      <p class="section-body login-desc">Enter your email and we'll send you a reset link.</p>

      <form id="forgotForm" autocomplete="off" novalidate>

        <div class="login-group">
          <label class="login-label" for="email">Email</label>
          <input class="login-input" id="email" name="email" type="email" inputmode="email" required autocomplete="username" placeholder="your@email.com">
        </div>

        <button id="forgotBtn" class="btn btn-primary login-submit" type="submit">Send reset link</button>

        <p id="forgotMsg" class="login-error" role="alert"></p>

        <div class="login-helpers login-helpers--center">
          <a href="login.html" class="login-forgot">Back to sign in</a>
        </div>

      </form>

    </div>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
